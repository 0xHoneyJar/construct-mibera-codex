# Loa Framework Configuration
# This file is yours to customize - framework updates will never modify it

# =============================================================================
# Persistence Mode
# =============================================================================
# - standard: Commit grimoire and beads to repo (default)
# - stealth: Add state files to .gitignore, local-only operation
persistence_mode: standard

# =============================================================================
# Integrity Enforcement
# =============================================================================
# - strict: Block agent execution on System Zone drift (recommended)
# - warn: Warn but allow execution
# - disabled: No integrity checks (not recommended)
integrity_enforcement: strict

# =============================================================================
# Drift Resolution Policy
# =============================================================================
# - code: Update documentation to match implementation (existing codebases)
# - docs: Create beads to fix code to match documentation (greenfield)
# - ask: Always prompt for human decision
drift_resolution: code

# =============================================================================
# Agent Configuration
# =============================================================================
disabled_agents: []
# disabled_agents:
#   - auditing-security
#   - translating-for-executives

# =============================================================================
# Structured Memory
# =============================================================================
memory:
  notes_file: grimoires/loa/NOTES.md
  trajectory_dir: grimoires/loa/a2a/trajectory
  # Auto-compact trajectory logs older than N days
  trajectory_retention_days: 30

# =============================================================================
# Evaluation-Driven Development
# =============================================================================
edd:
  enabled: true
  # Require N test scenarios before marking task complete
  min_test_scenarios: 3
  # Audit reasoning trajectory for hallucination
  trajectory_audit: true

# =============================================================================
# Context Hygiene
# =============================================================================
compaction:
  enabled: true
  threshold: 5

# =============================================================================
# Integrations
# =============================================================================
integrations:
  - github

# =============================================================================
# Framework Upgrade Behavior
# =============================================================================
upgrade:
  # Create git commit after mount/upgrade (default: true)
  auto_commit: true
  # Create version tag after mount/upgrade (default: true)
  auto_tag: true
  # Conventional commit prefix (default: "chore")
  commit_prefix: "chore"

# =============================================================================
# Run Mode
# =============================================================================
run_mode:
  enabled: true
  defaults:
    max_cycles: 20
    timeout_hours: 8

# =============================================================================
# Simstim Workflow (HITL-accelerated PRD→SDD→Sprint→Implementation)
# =============================================================================
simstim:
  enabled: true
  # Optional sub-phases — off by default (progressive rollout, opt-in)
  bridgebuilder_design_review: false # Phase 3.5
  flatline:
    beads_loop: false # Phase 6.5

# =============================================================================
# Flatline Protocol — multi-model adversarial review
# =============================================================================
# Models route through cheval headless adapters (subscription auth) via
# hounfour.aliases below. Forward-compat names match VALID_MODEL_PATTERNS in
# flatline-orchestrator but fall through model-adapter.sh shim's
# resolve_provider_id to as-is pass-through, then hit cheval aliases that
# route to the operator's logged-in claude/codex/gemini subscriptions.
# Mirrors bonfire's wiring (loa#727).
flatline_protocol:
  enabled: true
  # Use names the local orchestrator validates against. The hounfour aliases
  # below route these to subscription headless adapters at the model-adapter
  # layer (when flatline_routing: true).
  models:
    primary: opus
    secondary: gpt-5.3-codex
  max_iterations: 5
  knowledge:
    notebooklm:
      enabled: false

# =============================================================================
# Cheval / Hounfour aliases — subscription model routing
# =============================================================================
# flatline_routing: true tells model-adapter.sh to translate model names to
# cheval.py (model-invoke) calls instead of API-keyed legacy paths. When
# subscription auth is logged in (claude/codex/gemini), reviews route through
# the operator's subscription accounts.
hounfour:
  flatline_routing: true
  aliases:
    # Local orchestrator-recognized names → subscription headless bridges
    opus: claude-headless:claude-opus-4-7
    gpt-5.3-codex: codex-headless:gpt-5.5
    claude-opus-4.6: claude-headless:claude-opus-4-7
    claude-opus-4.5: claude-headless:claude-opus-4-7
    gpt-5.2-codex: codex-headless:gpt-5.5
    gpt-5.2: codex-headless:gpt-5.5
    gemini-2.5-pro: gemini-headless:gemini-3.1-pro-preview
    gemini-2.5-flash: gemini-headless:gemini-3.1-pro-preview
    gemini-2.0: gemini-headless:gemini-3.1-pro-preview
    # Generic role aliases (kept for compatibility with other skills)
    reviewer: codex-headless:gpt-5.5
    reasoning: codex-headless:gpt-5.5
    deep-thinker: gemini-headless:gemini-3.1-pro-preview

# =============================================================================
# BUTTERFREEZONE Configuration
# =============================================================================
butterfreezone:
  output_path: BUTTERFREEZONE.md
  staleness_days: 30
  ecosystem:
    - repo: 0xHoneyJar/loa
      role: framework
      interface: butterfreezone-mesh
      protocol: butterfreezone@1.0
    - repo: 0xHoneyJar/midi-interface
      role: consumer
      interface: badge-validation
  capability_requirements:
    - filesystem: read
  culture:
    naming_etymology: >
      Mibera — "mi" (me/self) + "bera" (bear). Time-travelling Rebased Retard Beras.
      The name captures the self-referential, irreverent spirit of the collection.
    methodology: >
      Generative mythology — 10,000 unique identities synthesized from archetypes,
      ancestors, drugs, tarot, astrology, and time periods spanning 15,000 years.
    principles:
      - Traits are signals, not scripts
      - Load-bearing signals define worldview; textural signals color expression
      - Every entity is a synthesis, not a checklist
