# Beacon MCP + CLI declaration for construct-mibera-codex
# Generated following the constructs-mcp-shape + construct-surface-decision-tree doctrines
# (see vault: constructs-mcp-shape, constructs-mcp-deployment-topology, construct-surface-decision-tree)

# Bucket-1 surface (per `~/vault/wiki/concepts/construct-surface-decision-tree.md`):
# stateless data-shaped construct with both human + agent consumers — CLI primary,
# MCP wraps. Subcommands mirror MCP tools 1:1 (parallel verbs, cross-construct legibility).

cli:
  binary: micodex
  entry: bin/micodex.ts
  install: npx @0xhoneyjarxhoneyjar/construct-mibera-codex   # or pack-local via Loa
  subcommands:
    - micodex lookup zone <slug>
    - micodex lookup archetype <name>
    - micodex lookup factor <factor-id>
    - micodex lookup grail <id|slug|name> [--field=<name>]
    - micodex lookup mibera <token-id>
    - micodex list zones
    - micodex list archetypes
    - micodex validate <type> <value> [--consumer-hint=<id>]
  output: stdout JSON (compact JSON via --field=<name> for raw text)
  exit_codes:
    0: success
    1: not_found
    2: usage_error

mcp:
  shape: data
  paths:
    - stdio
    - remote-http
  remote:
    transport: streamable-http
    endpoint: ${MCP_REMOTE_ENDPOINT}  # production: https://mcp.0xhoneyjar.xyz/codex/mcp
  tools:
    - lookup_zone
    - lookup_archetype
    - lookup_factor
    - lookup_grail
    - lookup_mibera
    - list_zones
    - list_archetypes
    - validate_world_element
  source_of_truth:
    type: git_repo
    files:
      - core-lore/festival-zones-vocabulary.md
      - core-lore/archetypes.md
      - core-lore/factor-lore.md
      - _codex/data/grails.jsonl
      - _codex/data/miberas.jsonl
  tiers:
    hard:
      - zone.slug
      - zone.emoji
      - zone.archetype
      - archetype.name
      - archetype.zodiac_signs
      - archetype.season
      - factor.id
      - factor.dimension
      - mibera.id
      - mibera.archetype
      - mibera.ancestor
      - grail.id
      - grail.name
      - grail.category
    soft:
      - zone.essence
      - zone.lynch_primitives
      - zone.kansei_tokens
      - archetype.figures
      - archetype.events
      - archetype.fashion
      - factor.lore
    llm_owned:
      - narrator_voice
      - activity_class_word
      - closing_observation
  payment:
    enabled: false   # x402 wrapping deferred to v2

