# Beacon v2 declaration for construct-mibera-codex
# Schema: @0xhoneyjar/beacon-schema (Cycle C · v0.3 broadcast layer)
# Spec: SDD §2.3 — Codex beacon.yaml v2 (P1 deliverable)
#
# Bucket-1 surface (per `~/vault/wiki/concepts/construct-surface-decision-tree.md`):
# stateless data-shaped construct with both human + agent consumers — CLI primary,
# MCP wraps. Subcommands mirror MCP tools 1:1 (parallel verbs, cross-construct legibility).
#
# Per gateway-as-registry doctrine: this beacon is upstream-broadcast (B-axis fields
# resolve here). Registry policy (visibility/access/status) lives in
# freeside-mcp-gateway/src/tenants.ts (curator-owned).

schema_version: "2"

cli:
  binary: micodex
  entry: bin/micodex.ts
  install: npx @0xhoneyjar/construct-mibera-codex
  subcommands:
    - micodex lookup zone <slug>
    - micodex lookup archetype <name>
    - micodex lookup factor <factor-id>
    - micodex lookup grail <id|slug|name> [--field=<name>]
    - micodex lookup mibera <token-id>
    - micodex list zones
    - micodex list archetypes
    - micodex validate <type> <value> [--consumer-hint=<id>]
  output: stdout JSON (compact JSON via --field=<name> for raw text)
  exit_codes:
    "0": success
    "1": not_found
    "2": usage_error

mcp:
  shape: data
  paths:
    - stdio
    - remote-http
  remote:
    transport: streamable-http
    endpoint: ${MCP_REMOTE_ENDPOINT}  # production: https://mcp.0xhoneyjar.xyz/codex/mcp
  auth:
    kind: none                          # NEW in v2 · was implicit in v1
  capabilities:
    - tools
  tools:
    - lookup_zone
    - lookup_archetype
    - lookup_factor
    - lookup_grail
    - lookup_mibera
    - list_zones
    - list_archetypes
    - validate_world_element
  source_of_truth:
    type: git_repo
    files:
      - core-lore/festival-zones-vocabulary.md
      - core-lore/archetypes.md
      - core-lore/factor-lore.md
      - _codex/data/grails.jsonl
      - _codex/data/miberas.jsonl
  tiers:
    hard:
      - zone.slug
      - zone.emoji
      - zone.archetype
      - archetype.name
      - archetype.zodiac_signs
      - archetype.season
      - factor.id
      - factor.dimension
      - mibera.id
      - mibera.archetype
      - mibera.ancestor
      - grail.id
      - grail.name
      - grail.category
    soft:
      - zone.essence
      - zone.lynch_primitives
      - zone.kansei_tokens
      - archetype.figures
      - archetype.events
      - archetype.fashion
      - factor.lore
    llm_owned:
      - narrator_voice
      - activity_class_word
      - closing_observation
  pricing:
    model: free
    description: free as in libre — read-only canon
  publisher: 0xHoneyJar
  documentation: https://codex.0xhoneyjar.xyz   # soft-deprecated · prefer docs.url (Cycle D)

payment:
  enabled: false   # x402 wrapping deferred to v0.4

