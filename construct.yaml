schema_version: 3
name: "Mibera Codex"
slug: mibera-codex
version: 1.1.0
construct_type: codex
type: codex
description: "Lore database for Mibera NFTs. Query and browse 10,000 digital identities across 7 dimensions (archetype, ancestor, element, tarot, era, molecule, swag rank). Cross-reference trait connections and look up canonical data. Ships an MCP server (stdio) for narrative-bot consumers — anti-hallucination lookup for zones, archetypes, factors, grails, and miberas with fuzzy validation + coverage-gap logging."
short_description: "Mibera identity knowledge base + codex-mcp"
domain:
  - documentation
author: 0xHoneyJar
license: MIT
visibility: public

skills:
  - slug: browse-codex
    path: skills/browse-codex
    description: "Navigate the codex by dimension — archetype, ancestor, element, drug, era, tarot, swag rank"
  - slug: query-entity
    path: skills/query-entity
    description: "Look up any mibera, trait, drug, ancestor, grail, or tarot card by ID or name"
  - slug: cross-reference
    path: skills/cross-reference
    description: "Find connections across entity types — drug-tarot pairings, ancestor-archetype clusters, trait rarity"

commands:
  - name: codex
    path: commands/codex.md
    description: "Query the Mibera knowledge base"

cli:
  binary: micodex
  entry: bin/micodex.ts
  declaration: beacon.yaml
  subcommands:
    - lookup zone <slug>
    - lookup archetype <name>
    - lookup factor <factor-id>
    - lookup grail <id|slug|name>
    - lookup mibera <token-id>
    - list zones
    - list archetypes
    - validate <type> <value>

mcp:
  shape: data
  paths:
    - stdio
  entry: bin/mcp.ts
  declaration: beacon.yaml
  tools:
    - lookup_zone
    - lookup_archetype
    - lookup_factor
    - lookup_grail
    - lookup_mibera
    - list_zones
    - list_archetypes
    - validate_world_element

streams:
  reads:
    - Intent
    - Operator-Model
    - Artifact
  writes:
    - Verdict
    - Artifact

capabilities:
  model_tier: haiku
  danger_level: safe
  effort_hint: small
  downgrade_allowed: true
  execution_hint: parallel
  requires:
    tool_calling: true
    thinking_traces: false
    vision: false

identity:
  persona: identity/persona.yaml
  expertise: identity/expertise.yaml
