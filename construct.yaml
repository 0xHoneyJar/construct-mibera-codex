  - slug: query-entity
    path: skills/query-entity
    description: "Look up any mibera, trait, drug, ancestor, grail, or tarot card by ID or name"
  - slug: cross-reference
    path: skills/cross-reference
    description: "Find connections across entity types — drug-tarot pairings, ancestor-archetype clusters, trait rarity"

commands:
